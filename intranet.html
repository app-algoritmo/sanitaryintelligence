<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Sanitary Intelligence" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#667eea" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Intranet · Sanitary Intelligence</title>
  <style>
    :root {
      --primary: #667eea;
      --secondary: #764ba2;
      --grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --white: #ffffff;
      --off-white: #f8f9ff;
      --light: #eef0ff;
      --border: #e2e5f5;
      --text: #1a1a2e;
      --muted: #6b7280;
      --shadow-lg: 0 16px 48px rgba(102,126,234,.18);
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:var(--font);background:var(--off-white);color:var(--text);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{background:var(--white);border:1px solid var(--border);border-radius:20px;padding:48px 40px;max-width:480px;text-align:center;box-shadow:var(--shadow-lg);}
    .icon{font-size:48px;margin-bottom:18px;}
    h1{font-size:1.5rem;font-weight:800;margin-bottom:10px;}
    .tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--light);color:var(--primary);padding:6px 16px;border-radius:20px;margin-bottom:18px;}
    p{color:var(--muted);font-size:14.5px;margin-bottom:8px;}
    ul{text-align:left;color:var(--muted);font-size:14px;margin:18px 0;padding-left:0;list-style:none;}
    ul li{padding:8px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
    ul li:last-child{border-bottom:none;}
    .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);flex-shrink:0;}
    a.back{display:inline-block;margin-top:20px;color:var(--primary);text-decoration:none;font-weight:600;font-size:14px;}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🏭</div>
    <span class="tag">Em desenvolvimento</span>
    <h1>Intranet de Produção</h1>
    <p>Estamos construindo o módulo de controle da linha de produção.</p>
    <ul>
      <li><span class="dot"></span> Controle de embalagem</li>
      <li><span class="dot"></span> Conferência de pedidos</li>
      <li><span class="dot"></span> Leitura de código de barras</li>
    </ul>
    <p>Volte em breve para acompanhar as novidades.</p>
    <a class="back" href="access.html">← Voltar para a Central de Ferramentas</a>
  </div>
</body>
</html>
